---
- name: "Check the presence of /opt/mhtml-converter"
  stat:
    path: "/opt/mhtml-converter"
  register: mhtml_converter
  changed_when: false 

# Download mhtml-converter

- name: "Installing Tools from GitHub Repositories"
  git:
    repo: "{{ item.url }}"
    dest: "{{ item.destination }}"
  loop: "{{ GitHubTools }}"
  become: true
  become_method: sudo
  when: not mhtml_converter.stat.exists

- name: "Change owner of downloaded GitHub Projects"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
  loop: "{{ GitHubTools }}"
  become: true
  become_method: sudo

- name: "Debug ansible_facts['architecture']"
  debug:
    var: ansible_facts['architecture']

- name: "Create Temporary Build Directory"
  tempfile:
    state: directory
  register: build_dir
  changed_when: false

- name: "Copying golang script to download github releases"
  copy: 
    src: "githubdownload.go"
    dest: "{{ build_dir.path }}/githubdownload.go"
    owner: root
    group: root
    mode: 0755
  become: true
  become_method: sudo
  changed_when: false

- name: "Downloading GitHub Tools"
  shell: "go run {{ build_dir.path }}/githubdownload.go {{ item.repo }} {{ item.regex }} {{ item.destination }}"
  environment:
    PATH: "/usr/local/go/bin"
    GITHUB_TOKEN: "{{ github_api_key }}"
  loop: "{{ GitHubReleases }}"
  become: true
  become_method: sudo

- name: "Recursively change owner of files in GitHub Tools directories"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    recurse: yes
  loop: "{{ GitHubReleases }}"
  become: true
  become_method: sudo

- name: "Make downloaded GitHub Tools Executable"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0755
    recurse: yes
  loop: "{{ GitHubReleases }}"
  become: true
  become_method: sudo

- name: "Downloading apktool wrapper tool"
  get_url:
    url: "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool"
    dest: /usr/local/bin/apktool
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0755
  become: true
  become_method: sudo

