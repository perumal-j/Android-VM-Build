- name: "Downloading GitHub Tools"
  shell: "go run {{ build_dir.path }}/githubdownload.go {{ item.repo }} {{ item.regex }} {{ item.destination }}"
  environment:
    PATH: "/usr/local/go/bin"
    GITHUB_TOKEN: "{{ github_api_key }}"
  loop: "{{ GitHubReleasesBinaryDownload_ARM }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "aarch64"

- name: "Recursively change owner of files in GitHub Tools directories"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    recurse: yes
  loop: "{{ GitHubReleasesBinaryDownload_ARM }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "aarch64"

- name: "Make downloaded GitHub Binaries Executable"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0755
    recurse: yes
  loop: "{{ GitHubReleasesBinaryDownload_ARM }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "aarch64"

- name: "Rename downloaded GitHub Binaries AppImage to clean name"
  shell: |
    mv {{ item.destination }}/{{ item.glob }} {{ item.destination }}/{{ item.new_name }}
  args:
    creates: "{{ item.destination }}/{{ item.new_name }}"
  loop: "{{ GitHubReleasesBinaryDownload_ARM }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "aarch64"

- name: "Downloading GitHub Tools"
  shell: "go run {{ build_dir.path }}/githubdownload.go {{ item.repo }} {{ item.regex }} {{ item.destination }}"
  environment:
    PATH: "/usr/local/go/bin"
    GITHUB_TOKEN: "{{ github_api_key }}"
  loop: "{{ GitHubReleasesBinaryDownload_x86_64 }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "x86_64"

- name: "Recursively change owner of files in GitHub Tools directories"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    recurse: yes
  loop: "{{ GitHubReleasesBinaryDownload_x86_64 }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "x86_64"

- name: "Make downloaded GitHub Binaries Executable"
  file:
    path: "{{ item.destination }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0755
    recurse: yes
  loop: "{{ GitHubReleasesBinaryDownload_x86_64 }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "x86_64"

- name: "Rename downloaded GitHub Binaries AppImage to clean name"
  shell: "mv {{ item.destination }}/{{ item.glob }} {{ item.destination }}/{{ item.new_name }}"
  args:
    removes: "{{ item.destination }}/{{ item.glob }}"
  loop: "{{ GitHubReleasesBinaryDownload_x86_64 }}"
  become: true
  become_method: sudo
  when: ansible_facts['architecture'] == "x86_64"

- name: "Git Cloning Linux Memory Extractor(LiME)"
  git:
    repo: "https://github.com/jtsylve/LiME.git"
    dest: "/opt/LiME"
    force: yes
  become: true
  become_method: sudo

