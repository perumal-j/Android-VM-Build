---
DesktopLaunchers:
  - "sublime-text"
  - "vscode"
  - "firefox"
  - "brave-browser"
  - "obsidian"
  - "burp-suite"
  - "caido"
  - "Android-Studio"
  - "Autopsy"
  - "JADX-GUI"
  - "Ghidra"
  - "ByteCode-Viewer"

AppPaths:
  - "/usr/bin/subl"
  - "/usr/bin/code"
  - "/usr/bin/firefox"
